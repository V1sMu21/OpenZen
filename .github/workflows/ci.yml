name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

# OpenZen is a macOS-only product (Tauri desktop app on a Mac host), so
# CI mirrors the real runtime instead of burning cycles on Linux runners
# where platform-dependent tests misbehave.

jobs:
  check:
    name: Check compilation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: cargo check
        run: cargo check --workspace
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Run tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo test
        run: cargo test --workspace -- --test-threads=1

  build:
    name: Release build
    needs: [check, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontends/package-lock.json
      - name: Build frontend
        working-directory: frontends
        run: npm ci && npm run build
      - name: cargo build --release
        run: cargo build --release
      - name: Check binary size
        run: |
          SIZE=$(stat -f%z target/release/openzen)
          MAX=$((50 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "Binary size $SIZE exceeds 50MB limit"
            exit 1
          fi
          echo "Binary size: $SIZE bytes"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openzen-release
          path: |
            target/release/openzen
            target/release/openzen-tauri
          if-no-files-found: error
