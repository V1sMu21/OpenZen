name: Release

# 触发: 推送 v* tag（scripts/release.sh 创建 tag 后自动触发）
# 闸门: 复用 ci.yml 的 check + test（本文件只处理构建与发布）
# 产物: macOS dmg + app 上传到 GitHub Release，版本号 = tag 名

on:
  push:
    tags:
      - "v*"

# GITHUB_TOKEN 默认对 Release 只读（较新仓库策略），显式授予写权限
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # 门禁 1: 与 CI 相同的静态检查（此前 release 只跑 test，弱于 CI）
  check:
    name: Check gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  # 测试闸门: 发布前强制全绿（macOS 与运行环境一致）
  test:
    name: Test gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo test
        run: cargo test --workspace -- --test-threads=1

  # 门禁 3: tag 与三处版本字段一致（版本号曾经互不一致）
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches tauri.conf.json and package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAURI_V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          NPM_V=$(python3 -c "import json;print(json.load(open('frontends/package.json'))['version'])")
          echo "tag=$TAG tauri=$TAURI_V npm=$NPM_V"
          if [ "$TAG" != "$TAURI_V" ] || [ "$TAG" != "$NPM_V" ]; then
            echo "::error::version mismatch — tag v$TAG but tauri.conf.json=$TAURI_V / package.json=$NPM_V"
            exit 1
          fi

  build-macos:
    name: Build macOS dmg
    needs: [check, test, version-check]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontends/package-lock.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build frontend
        working-directory: frontends
        run: npm ci && npm run build

      - name: Install scripts deps
        working-directory: scripts
        run: npm ci || npm install --no-audit --no-fund || true

      - name: Install tauri-cli
        # Pinned: an upstream tauri-cli change used to break releases with
        # no local repro. Bump deliberately together with the tauri crate.
        run: cargo install tauri-cli --version "^2.11" --locked

      - name: Build release bundle
        run: cargo tauri build

      - name: Extract current version notes
        # CHANGELOG.md keeps the full history. The Release page shows only the
        # published tag's Bug Fixes and Features: its `## vX.Y.Z` section with
        # every other group (chore/style/docs/...) dropped.
        run: awk '/^## / { if (++ver > 1) exit; print; next } /^### / { keep = ($0 ~ /Bug Fixes|Features/); if (keep) { print ""; print; pending = 1 } next } keep { if ($0 == "") next; if (pending) { print ""; pending = 0 } print }' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          update_release: true
          overwrite: true
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
