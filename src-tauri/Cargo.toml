[package]
name = "openzen-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "openzen_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
chrono.workspace = true
oz-core-types = { path = "../crates/oz-core-types" }
oz-config = { path = "../crates/oz-config" }
oz-core = { path = "../crates/oz-core" }
oz-llm = { path = "../crates/oz-llm" }
oz-tools = { path = "../crates/oz-tools" }
oz-memory = { path = "../crates/oz-memory" }
oz-server = { path = "../crates/oz-server" }
oz-safety = { path = "../crates/oz-safety" }
oz-scheduler = { path = "../crates/oz-scheduler" }
oz-skill-mcp = { path = "../crates/oz-skill-mcp" }
oz-mcp = { path = "../crates/oz-mcp" }
oz-platform = { path = "../crates/oz-platform" }
oz-platform-feishu = { path = "../crates/oz-platform-feishu" }
oz-platform-telegram = { path = "../crates/oz-platform-telegram" }
oz-platform-wechat = { path = "../crates/oz-platform-wechat" }
entropy_memory_engine.workspace = true
uuid.workspace = true
nix = { version = "0.31", features = ["process", "signal", "term", "fs"] }
libc = "0.2"
calamine = "0.24"
toml.workspace = true
# Format-preserving TOML editing (keeps comments in hand-edited files like
# servers.toml); already in the tree as toml 0.8's internal engine.
toml_edit = "0.19"
async-trait.workspace = true
