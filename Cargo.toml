[workspace]
resolver = "2"
members = [
    "crates/oz-core-types",
    "crates/oz-config",
    "crates/oz-core",
    "crates/oz-llm",
    "crates/oz-tools",
    "crates/oz-browser",
    "crates/oz-memory",
    "crates/oz-mcp",
    "crates/oz-skill-mcp",
    "crates/oz-safety",
    "crates/oz-steward",
    "crates/oz-scheduler",
    "crates/oz-server",
    "crates/oz-reflect",
    "crates/oz-plugin",
    "crates/oz-import",
    "crates/oz-tui",
    "crates/oz-tests",
    "crates/oz-testkit",
    "crates/oz-agent",
    "crates/oz-platform",
    "crates/oz-platform-telegram",
    "crates/oz-platform-feishu",
    "crates/oz-platform-wechat",
    "src-tauri",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "process", "net", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1"
glob = "0.3"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tempfile = "3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
ratatui = "0.29"
crossterm = "0.28"
memmap2 = "0.9"
linkme = "0.3"
toml = "0.8"
# ERME — entropy-reduced memory engine (vendored for CI-buildable path dependency)
entropy_memory_engine = { path = "vendor/entropy-memory-engine" }

[package]
name = "openzen"
version = "0.1.0"
edition = "2021"
description = "OpenZen - Minimalist self-evolving autonomous agent framework (Rust)"

[dependencies]
oz-core-types = { path = "crates/oz-core-types" }
oz-config = { path = "crates/oz-config" }
oz-core = { path = "crates/oz-core" }
oz-llm = { path = "crates/oz-llm" }
oz-tools = { path = "crates/oz-tools" }
oz-memory = { path = "crates/oz-memory" }
oz-safety = { path = "crates/oz-safety" }
oz-scheduler = { path = "crates/oz-scheduler" }
oz-server = { path = "crates/oz-server" }
oz-reflect = { path = "crates/oz-reflect" }
oz-plugin = { path = "crates/oz-plugin" }
oz-agent = { path = "crates/oz-agent" }
oz-tui = { path = "crates/oz-tui" }
oz-skill-mcp = { path = "crates/oz-skill-mcp" }
oz-platform = { path = "crates/oz-platform" }
oz-platform-feishu = { path = "crates/oz-platform-feishu" }
oz-platform-telegram = { path = "crates/oz-platform-telegram" }
oz-platform-wechat = { path = "crates/oz-platform-wechat" }

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
toml.workspace = true
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
panic = "unwind"

[profile.dev]
opt-level = 0
# 调试信息只留行号表：断点/回溯仍有 file:line，但 target/debug 体积能小一大截。
# 需要完整变量视图时临时改回 true，或 `CARGO_PROFILE_DEV_DEBUG=true cargo build`。
debug = "line-tables-only"

# 第三方依赖（Tauri 生态几百个 crate）不带调试信息 —— 它们是 target/debug 的大头，
# 而且几乎没人会单步进依赖源码。工作区自己的 crate 不受影响。
[profile.dev.package."*"]
debug = false

[[bin]]
name = "openzen"
path = "src/main.rs"
