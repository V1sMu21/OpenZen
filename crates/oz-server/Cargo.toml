[package]
name = "oz-server"
version = "0.1.0"
edition = "2021"

[dependencies]
oz-core-types = { path = "../oz-core-types" }
oz-core = { path = "../oz-core" }
oz-config = { path = "../oz-config" }
oz-llm = { path = "../oz-llm" }
oz-tools = { path = "../oz-tools" }
oz-mcp = { path = "../oz-mcp" }
oz-memory = { path = "../oz-memory" }
oz-agent = { path = "../oz-agent" }
oz-safety = { path = "../oz-safety" }
oz-skill-mcp = { path = "../oz-skill-mcp" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
async-trait.workspace = true
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest.workspace = true
toml = "0.8"

[dependencies.axum]
version = "0.7"
features = ["macros"]

[dependencies.tower-http]
version = "0.5"
features = ["cors", "fs"]

[dependencies.clap]
version = "4.5"
features = ["derive"]

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.4", features = ["util"] }
